name: ${COMPOSE_PROJECT_NAME:-kubephos}

x-kubephos-image: &kubephos-image ${KUBEPHOS_IMAGE:-ghcr.io/unict-cclab/kubephos}:${KUBEPHOS_VERSION:-latest}

x-platform-environment: &platform-environment
  KUBEPHOS_DATABASE_URL: postgres://kubephos:${POSTGRES_PASSWORD:?Run ./install.sh to generate credentials}@postgres:5432/kubephos?sslmode=disable
  KUBEPHOS_ARTIFACT_ENDPOINT: http://seaweedfs:8888
  KUBEPHOS_PLUGIN_DIRECTORY: /opt/kubephos/plugins
  KUBEPHOS_CATALOG_DIRECTORY: /opt/kubephos/catalog/applications
  KUBEPHOS_WEB_DIRECTORY: /opt/kubephos/web
  KUBEPHOS_CREDENTIAL_KEY_FILE: /var/lib/kubephos/master.key
  KUBEPHOS_URL: ${KUBEPHOS_URL:-http://localhost:${KUBEPHOS_PORT:-8080}}
  KUBEPHOS_KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
  KUBEPHOS_KEYCLOAK_PUBLIC_URL: ${KUBEPHOS_URL:-http://localhost:${KUBEPHOS_PORT:-8080}}/auth
  KUBEPHOS_KEYCLOAK_REALM: kubephos
  KUBEPHOS_KEYCLOAK_CLIENT_ID: kubephos
  KUBEPHOS_KEYCLOAK_CLIENT_SECRET: ${KUBEPHOS_KEYCLOAK_CLIENT_SECRET:?Run ./install.sh to generate credentials}
  KUBEPHOS_KEYCLOAK_MANAGEMENT_CLIENT_ID: kubephos-management
  KUBEPHOS_KEYCLOAK_MANAGEMENT_CLIENT_SECRET: ${KUBEPHOS_KEYCLOAK_MANAGEMENT_CLIENT_SECRET:?Run ./install.sh to generate credentials}

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: kubephos
      POSTGRES_USER: kubephos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./install.sh to generate credentials}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubephos -d kubephos"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  keycloak-db-init:
    image: postgres:18.6-alpine3.23
    environment:
      PGHOST: postgres
      PGDATABASE: kubephos
      PGUSER: kubephos
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run ./install.sh to generate credentials}
    command: ["sh", "-ec", "psql -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION kubephos'"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/kubephos
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: kubephos
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Run ./install.sh to generate credentials}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KUBEPHOS_URL:-http://localhost:${KUBEPHOS_PORT:-8080}}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: kubephos-bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KUBEPHOS_KEYCLOAK_ADMIN_PASSWORD:?Run ./install.sh to generate credentials}
      KUBEPHOS_URL: ${KUBEPHOS_URL:-http://localhost:${KUBEPHOS_PORT:-8080}}
      KUBEPHOS_KEYCLOAK_CLIENT_SECRET: ${KUBEPHOS_KEYCLOAK_CLIENT_SECRET:?Run ./install.sh to generate credentials}
      KUBEPHOS_KEYCLOAK_MANAGEMENT_CLIENT_SECRET: ${KUBEPHOS_KEYCLOAK_MANAGEMENT_CLIENT_SECRET:?Run ./install.sh to generate credentials}
    configs:
      - source: keycloak-realm
        target: /opt/keycloak/data/import/kubephos-realm.json
      - source: keycloak-theme-properties
        target: /opt/keycloak/themes/kubephos/login/theme.properties
      - source: keycloak-theme-css
        target: /opt/keycloak/themes/kubephos/login/resources/css/kubephos-v2.css
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  migration-files:
    image: *kubephos-image
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["cp -R /opt/kubephos/migrations/. /liquibase/changelog/"]
    volumes:
      - migration-data:/liquibase/changelog
    restart: "no"

  migrate:
    image: liquibase/liquibase:4.32.0
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/kubephos
      LIQUIBASE_COMMAND_USERNAME: kubephos
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:?Run ./install.sh to generate credentials}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog.yaml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    command: update
    depends_on:
      postgres:
        condition: service_healthy
      migration-files:
        condition: service_completed_successfully
    volumes:
      - migration-data:/liquibase/changelog:ro
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    command: server -dir=/data -filer -ip=seaweedfs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://seaweedfs:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - seaweed-data:/data
    restart: unless-stopped

  app:
    image: *kubephos-image
    init: true
    environment:
      <<: *platform-environment
      KUBEPHOS_HTTP_ADDRESS: :8080
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/kubephos", "doctor"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${KUBEPHOS_BIND_ADDRESS:-127.0.0.1}:${KUBEPHOS_PORT:-8080}:8080"
    volumes:
      - platform-data:/var/lib/kubephos
    restart: unless-stopped

  worker:
    image: *kubephos-image
    init: true
    command: worker
    environment:
      <<: *platform-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - platform-data:/var/lib/kubephos
    restart: unless-stopped

volumes:
  postgres-data:
  seaweed-data:
  platform-data:
  migration-data:

configs:
  keycloak-realm:
    content: |
      {
        "realm": "kubephos",
        "enabled": true,
        "displayName": "KubePhos",
        "loginTheme": "kubephos",
        "registrationAllowed": false,
        "resetPasswordAllowed": true,
        "loginWithEmailAllowed": true,
        "duplicateEmailsAllowed": false,
        "clients": [
          {
            "clientId": "kubephos",
            "name": "KubePhos",
            "enabled": true,
            "clientAuthenticatorType": "client-secret",
            "secret": "${KUBEPHOS_KEYCLOAK_CLIENT_SECRET:?Run ./install.sh to generate credentials}",
            "publicClient": false,
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": false,
            "serviceAccountsEnabled": false,
            "redirectUris": ["${KUBEPHOS_URL:-http://localhost:${KUBEPHOS_PORT:-8080}}/api/v1/auth/callback"],
            "webOrigins": ["${KUBEPHOS_URL:-http://localhost:${KUBEPHOS_PORT:-8080}}"],
            "attributes": {
              "pkce.code.challenge.method": "S256",
              "post.logout.redirect.uris": "${KUBEPHOS_URL:-http://localhost:${KUBEPHOS_PORT:-8080}}/*"
            }
          },
          {
            "clientId": "kubephos-management",
            "name": "KubePhos Management",
            "enabled": true,
            "clientAuthenticatorType": "client-secret",
            "secret": "${KUBEPHOS_KEYCLOAK_MANAGEMENT_CLIENT_SECRET:?Run ./install.sh to generate credentials}",
            "publicClient": false,
            "standardFlowEnabled": false,
            "directAccessGrantsEnabled": false,
            "serviceAccountsEnabled": true
          }
        ],
        "users": [
          {
            "username": "service-account-kubephos-management",
            "enabled": true,
            "serviceAccountClientId": "kubephos-management",
            "clientRoles": {
              "realm-management": ["manage-users", "query-users", "view-users"]
            }
          }
        ]
      }
  keycloak-theme-properties:
    content: |
      parent=keycloak.v2
      import=common/keycloak
      styles=css/styles.css css/kubephos-v2.css
  keycloak-theme-css:
    content: |
      @font-face {
        font-family: Geist;
        src: url("/fonts/geist-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        color-scheme: light;
        --kubephos-accent: #171717;
        --kubephos-canvas: #fafafa;
        --kubephos-ink: #171717;
        --kubephos-line: #e5e5e5;
        --kubephos-muted: #737373;
        --kubephos-surface: #ffffff;
        --kubephos-focus: rgba(115, 115, 115, .22);
      }
      html, body, button, input {
        font-family: Geist, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #keycloak-bg {
        min-height: 100vh;
        background: var(--kubephos-canvas);
        color: var(--kubephos-ink);
      }
      .pf-v5-c-login {
        min-height: 100vh;
        background: var(--kubephos-canvas);
      }
      .pf-v5-c-login__container {
        width: min(430px, calc(100% - 32px));
        margin: auto;
        padding: 48px 0;
      }
      #kc-header {
        margin: 0 0 18px;
        padding: 0;
      }
      #kc-header-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        color: var(--kubephos-ink) !important;
        font-size: 21px;
        font-weight: 500;
        letter-spacing: -.035em;
        text-transform: none;
      }
      #kc-header-wrapper::before {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 8px;
        background: #f5f5f5;
        color: var(--kubephos-accent);
        content: "K";
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0;
      }
      .pf-v5-c-login__main {
        overflow: hidden;
        border: 1px solid var(--kubephos-line) !important;
        border-block-start: 1px solid var(--kubephos-line) !important;
        border-radius: 12px;
        background: var(--kubephos-surface);
        box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
      }
      .pf-v5-c-login__main-header {
        border-top: 0 !important;
        padding: 32px 34px 6px;
      }
      .pf-v5-c-login__main-body {
        padding: 20px 34px 34px;
      }
      #kc-page-title {
        color: var(--kubephos-ink);
        font-size: 24px;
        font-weight: 400;
        letter-spacing: -.035em;
        line-height: 1.2;
      }
      .pf-v5-c-form {
        gap: 18px;
      }
      .pf-v5-c-form__label-text {
        color: var(--kubephos-ink);
        font-size: 14px;
        font-weight: 500;
      }
      .pf-v5-c-form-control {
        min-height: 44px;
        border: 1px solid #d4d4d4;
        border-radius: 8px;
        outline: 0;
        background: var(--kubephos-surface);
        box-shadow: none;
        transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
      }
      .pf-v5-c-form-control::before, .pf-v5-c-form-control::after {
        border: 0 !important;
        box-shadow: none !important;
      }
      .pf-v5-c-form-control:hover {
        border-color: #a3a3a3;
      }
      .pf-v5-c-form-control:focus-within {
        border-color: var(--kubephos-accent);
        outline: 0;
        box-shadow: 0 0 0 3px var(--kubephos-focus);
      }
      .pf-v5-c-form-control > input {
        width: 100%;
        min-height: 42px;
        border: 0 !important;
        outline: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        color: var(--kubephos-ink);
        font-size: 14px;
      }
      .pf-v5-c-form-control > input::placeholder {
        color: var(--kubephos-muted);
        opacity: .72;
      }
      .pf-v5-c-input-group {
        border-radius: 8px;
        transition: box-shadow .15s ease;
      }
      .pf-v5-c-input-group:focus-within {
        box-shadow: 0 0 0 3px var(--kubephos-focus);
      }
      .pf-v5-c-input-group .pf-v5-c-form-control {
        border-radius: 8px 0 0 8px;
      }
      .pf-v5-c-input-group:focus-within .pf-v5-c-form-control {
        border-color: var(--kubephos-accent);
        box-shadow: none;
      }
      .pf-v5-c-button.pf-m-control {
        min-width: 44px;
        border: 1px solid #d4d4d4;
        border-left: 0;
        border-radius: 0 8px 8px 0;
        background: var(--kubephos-surface);
        color: var(--kubephos-muted);
      }
      .pf-v5-c-button.pf-m-control::after {
        border: 0;
      }
      .pf-v5-c-input-group:focus-within .pf-v5-c-button.pf-m-control {
        border-color: var(--kubephos-accent);
      }
      .pf-v5-c-button.pf-m-control:focus-visible {
        outline: 0;
        background: color-mix(in srgb, var(--kubephos-accent) 8%, var(--kubephos-surface));
        box-shadow: none;
        color: var(--kubephos-accent);
      }
      .pf-v5-c-button.pf-m-primary {
        min-height: 44px;
        border-radius: 8px;
        background: var(--kubephos-accent);
        color: var(--kubephos-surface);
        font-size: 14px;
        font-weight: 500;
      }
      .pf-v5-c-button.pf-m-primary:hover, .pf-v5-c-button.pf-m-primary:focus {
        background: color-mix(in srgb, var(--kubephos-accent) 85%, var(--kubephos-surface));
      }
      .pf-v5-c-button.pf-m-primary:focus-visible, a:focus-visible {
        outline: 3px solid var(--kubephos-focus);
        outline-offset: 2px;
      }
      a, .pf-v5-c-helper-text__item-text a {
        color: var(--kubephos-accent);
        font-size: 12px;
        font-weight: 500;
      }
      .pf-v5-c-alert {
        border-radius: 9px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --kubephos-accent: #fafafa;
          --kubephos-canvas: #0a0a0a;
          --kubephos-ink: #fafafa;
          --kubephos-line: #404040;
          --kubephos-muted: #a3a3a3;
          --kubephos-surface: #171717;
          --kubephos-focus: rgba(163, 163, 163, .28);
        }
        .pf-v5-c-login {
          background: var(--kubephos-canvas);
        }
        #kc-header-wrapper::before {
          background: #262626;
        }
        .pf-v5-c-form-control, .pf-v5-c-button.pf-m-control {
          border-color: #404040;
          background: #262626;
        }
      }
      @media (max-width: 520px) {
        .pf-v5-c-login__container {
          padding: 28px 0;
        }
        .pf-v5-c-login__main-header {
          padding: 26px 24px 4px;
        }
        .pf-v5-c-login__main-body {
          padding: 18px 24px 26px;
        }
      }
