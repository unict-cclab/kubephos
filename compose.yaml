name: kubephos

x-kubephos-image: &kubephos-image ${KUBEPHOS_IMAGE:-ghcr.io/unict-cclab/kubephos}:${KUBEPHOS_VERSION:-latest}

x-platform-environment: &platform-environment
  KUBEPHOS_DATABASE_URL: postgres://kubephos:${POSTGRES_PASSWORD:-kubephos-dev}@postgres:5432/kubephos?sslmode=disable
  KUBEPHOS_ARTIFACT_ENDPOINT: http://seaweedfs:8888
  KUBEPHOS_PLUGIN_DIRECTORY: /opt/kubephos/plugins
  KUBEPHOS_CATALOG_DIRECTORY: /opt/kubephos/catalog/applications
  KUBEPHOS_WEB_DIRECTORY: /opt/kubephos/web
  KUBEPHOS_CREDENTIAL_KEY_FILE: /var/lib/kubephos/master.key
  KUBEPHOS_PLUGIN_RUNTIME_HOST: ${KUBEPHOS_PLUGIN_RUNTIME_HOST:-}
  KUBEPHOS_PLUGIN_RUNTIME_CA: ${KUBEPHOS_PLUGIN_RUNTIME_CA:-}
  KUBEPHOS_PLUGIN_RUNTIME_CERT: ${KUBEPHOS_PLUGIN_RUNTIME_CERT:-}
  KUBEPHOS_PLUGIN_RUNTIME_KEY: ${KUBEPHOS_PLUGIN_RUNTIME_KEY:-}
  KUBEPHOS_PLUGIN_ALLOWED_REGISTRIES: ${KUBEPHOS_PLUGIN_ALLOWED_REGISTRIES:-}
  KUBEPHOS_BUILD_ALLOWED_GIT_HOSTS: ${KUBEPHOS_BUILD_ALLOWED_GIT_HOSTS:-github.com}

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: kubephos
      POSTGRES_USER: kubephos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kubephos-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubephos -d kubephos"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  migration-files:
    image: *kubephos-image
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["cp -R /opt/kubephos/migrations/. /liquibase/changelog/"]
    volumes:
      - migration-data:/liquibase/changelog
    restart: "no"

  migrate:
    image: liquibase/liquibase:4.32.0
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/kubephos
      LIQUIBASE_COMMAND_USERNAME: kubephos
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-kubephos-dev}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog.yaml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    command: update
    depends_on:
      postgres:
        condition: service_healthy
      migration-files:
        condition: service_completed_successfully
    volumes:
      - migration-data:/liquibase/changelog:ro
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    command: server -dir=/data -filer -s3 -ip=seaweedfs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://seaweedfs:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - seaweed-data:/data
    restart: unless-stopped

  app:
    image: *kubephos-image
    init: true
    environment:
      <<: *platform-environment
      KUBEPHOS_HTTP_ADDRESS: :8080
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/kubephos", "doctor"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "${KUBEPHOS_BIND_ADDRESS:-127.0.0.1}:${KUBEPHOS_PORT:-8080}:8080"
    volumes:
      - platform-data:/var/lib/kubephos
    restart: unless-stopped

  worker:
    image: *kubephos-image
    init: true
    command: worker
    environment:
      <<: *platform-environment
      KUBEPHOS_INSTANCE_ID: ${HOSTNAME:-compose}
      KUBEPHOS_WORKER_CONCURRENCY: ${KUBEPHOS_WORKER_CONCURRENCY:-4}
      KUBEPHOS_WORKER_POLL_INTERVAL: ${KUBEPHOS_WORKER_POLL_INTERVAL:-500ms}
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    volumes:
      - platform-data:/var/lib/kubephos
    restart: unless-stopped

volumes:
  postgres-data:
  seaweed-data:
  platform-data:
  migration-data:
