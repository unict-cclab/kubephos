apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.registry.harbor.managed
  name: Managed OCI registry
  version: 0.1.0
  description: Installs and validates a managed OCI registry on one dedicated machine.
spec:
  protocol: v1alpha1
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - machineSetRef
      - machineAccessRef
      - registryName
    properties:
      machineSetRef:
        type: string
        title: Registry machine
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: MachineSet
        x-kubephos-artifact-version: v1alpha1
      machineAccessRef:
        type: string
        title: Machine access
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: MachineAccess
        x-kubephos-artifact-version: v1alpha1
      registryName:
        type: string
        title: Registry name
        pattern: "^[a-z0-9][a-z0-9-]{0,31}$"
        default: managed-registry
  runtime:
    executable: harbor-plugin
    timeout: 45m
  artifacts:
    inputs:
      - type: MachineSet
        version: v1alpha1
      - type: MachineAccess
        version: v1alpha1
    outputs:
      - type: RegistryEndpoint
        version: v1alpha1
      - type: RegistryCredential
        version: v1alpha1
  capabilities:
    - registry.oci.provision
    - registry.oci.preflight
    - registry.oci.cleanup
    - lifecycle.cleanup
  permissions:
    - network.ssh
    - registry.manage
