apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.cluster.cilium.mesh
  name: Cilium multi cluster environment
  version: 0.1.0
  description: Connects independently provisioned Kubernetes clusters and verifies
    their Cilium mesh.
spec:
  protocol: v1alpha1
  commands:
  - describe
  - validate
  - plan
  - precheck
  - execute
  - verify
  - status
  - cancel
  - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
    - name
    - members
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 32
      members:
        type: array
        minItems: 2
        maxItems: 6
        items:
          type: object
          additionalProperties: false
          required:
          - name
          - clusterId
          - connectionRef
          - observabilityRef
          - platformRef
          - inventoryRef
          - podCIDR
          properties:
            name:
              type: string
            clusterId:
              type: integer
              minimum: 1
              maximum: 255
            connectionRef:
              type: string
              format: kubephos-artifact-ref
              x-kubephos-artifact-type: ClusterConnection
              x-kubephos-artifact-version: v1alpha1
            observabilityRef:
              type: string
              format: kubephos-artifact-ref
              x-kubephos-artifact-type: ObservabilityCapability
              x-kubephos-artifact-version: v1alpha1
            platformRef:
              type: string
              format: kubephos-artifact-ref
              x-kubephos-artifact-type: ManagedPlatformCapability
              x-kubephos-artifact-version: v1alpha1
            inventoryRef:
              type: string
              format: kubephos-artifact-ref
              x-kubephos-artifact-type: ClusterInventory
              x-kubephos-artifact-version: v1alpha1
            podCIDR:
              type: string
  runtime:
    executable: cilium-mesh-plugin
    timeout: 60m
  artifacts:
    inputs:
    - type: ClusterConnection
      version: v1alpha1
    - type: ClusterInventory
      version: v1alpha1
    - type: ObservabilityCapability
      version: v1alpha1
    - type: ManagedPlatformCapability
      version: v1alpha1
    outputs:
    - type: ClusterEnvironment
      version: v1alpha1
  capabilities:
  - cluster.mesh.connect
  - cluster.mesh.preflight
  - cluster.mesh.cleanup
  - lifecycle.cleanup
  - lifecycle.cleanup.compatible
  permissions:
  - cluster.admin
  - network.http
