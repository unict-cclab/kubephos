apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.platform.managed
  name: Managed Kubernetes platform
  version: 0.3.0
  description: Installs and verifies the selected managed service mesh, chaos, autoscaling, logging, tracing and console components on top of the cluster support baseline.
spec:
  protocol: v1alpha1
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - clusterConnectionRef
    properties:
      clusterConnectionRef:
        type: string
        title: Kubernetes cluster
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ClusterConnection
        x-kubephos-artifact-version: v1alpha1
      components:
        type: array
        title: Cluster components
        maxItems: 32
        items:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,63}$
      reconcile:
        type: boolean
      ownershipMarker:
        type: string
        pattern: ^[0-9a-f]{32}$
        x-kubephos-hidden: true
  runtime:
    executable: managed-platform-plugin
    timeout: 30m
  artifacts:
    inputs:
      - type: ClusterConnection
        version: v1alpha1
    outputs:
      - type: ManagedPlatformCapability
        version: v1alpha1
      - type: ServiceCredential
        version: v1alpha1
  capabilities:
    - platform.managed.install
    - platform.managed.preflight
    - platform.managed.cleanup
    - lifecycle.cleanup
    - lifecycle.cleanup.compatible
  permissions:
    - cluster.admin
    - network.http
