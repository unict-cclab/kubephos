apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.platform.managed
  name: Managed Kubernetes platform
  version: 0.1.0
  description: Installs and verifies the release-managed Istio and chaos runtime baseline.
spec:
  protocol: v1alpha1
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - clusterConnectionRef
    properties:
      clusterConnectionRef:
        type: string
        title: Kubernetes cluster
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ClusterConnection
        x-kubephos-artifact-version: v1alpha1
  runtime:
    executable: managed-platform-plugin
    timeout: 30m
  artifacts:
    inputs:
      - type: ClusterConnection
        version: v1alpha1
    outputs:
      - type: ManagedPlatformCapability
        version: v1alpha1
  capabilities:
    - platform.managed.install
    - platform.managed.preflight
    - platform.managed.cleanup
    - lifecycle.cleanup
  permissions:
    - cluster.admin
    - network.http
