apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.load.kubernetes.session
  name: Interactive Kubernetes load session
  version: 0.6.1
  description: Runs an ordered RPS and geographic timeline using the immutable Locust journey declared by an application.
spec:
  protocol: v1alpha1
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - clusterConnectionRef
      - applicationDeploymentRef
      - loadScenarioSetRef
      - scenarioId
      - action
      - replicas
      - maxUsers
      - spawnRate
    properties:
      clusterConnectionRef:
        type: string
        title: Kubernetes cluster
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ClusterConnection
        x-kubephos-artifact-version: v1alpha1
      applicationDeploymentRef:
        type: string
        title: Application deployment
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ApplicationDeployment
        x-kubephos-artifact-version: v1alpha1
      loadScenarioSetRef:
        type: string
        title: Load scenarios
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: LoadScenarioSet
        x-kubephos-artifact-version: v1alpha1
      scenarioId:
        type: string
        title: Load scenario
        description: User behavior implemented by the Locust file supplied by the selected application.
        minLength: 1
        maxLength: 63
        default: storefront-journey
      action:
        type: string
        title: Action
        x-kubephos-primary-action: true
        enum:
          - start
          - stop
          - resume
        default: start
      interactive:
        type: boolean
        title: Interactive session
        default: false
      replicas:
        type: integer
        title: Load workers
        minimum: 1
        maximum: 100
        default: 1
      maxUsers:
        type: integer
        title: Maximum concurrent users per worker
        minimum: 1
        maximum: 100000
        default: 1000
      spawnRate:
        type: number
        title: Users started per second
        minimum: 0.1
        maximum: 100000
        default: 10
      steps:
        type: array
        title: Temporal workload timeline
        maxItems: 100
        items:
          type: object
      geographicSteps:
        type: array
        title: Geographic traffic timeline
        maxItems: 100
        items:
          type: object
  runtime:
    executable: load-session-plugin
    timeout: 3h
  artifacts:
    inputs:
      - type: ClusterConnection
        version: v1alpha1
      - type: ApplicationDeployment
        version: v1alpha1
      - type: LoadScenarioSet
        version: v1alpha1
    outputs:
      - type: LoadSession
        version: v1alpha1
  capabilities:
    - load.session.control
    - load.session.preflight
    - load.session.cleanup
    - lifecycle.cleanup
  permissions:
    - cluster.admin
