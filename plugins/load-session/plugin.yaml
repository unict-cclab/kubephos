apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.load.kubernetes.session
  name: Interactive Kubernetes load session
  version: 0.3.0
  description: Starts, stops or resumes a generic Locust runtime using the immutable scenario declared by an application.
spec:
  protocol: v1alpha1
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - clusterConnectionRef
      - applicationDeploymentRef
      - loadScenarioSetRef
      - scenarioId
      - action
      - replicas
      - users
      - spawnRate
      - pattern
      - durationSeconds
    properties:
      clusterConnectionRef:
        type: string
        title: Kubernetes cluster
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ClusterConnection
        x-kubephos-artifact-version: v1alpha1
      applicationDeploymentRef:
        type: string
        title: Application deployment
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ApplicationDeployment
        x-kubephos-artifact-version: v1alpha1
      loadScenarioSetRef:
        type: string
        title: Load scenarios
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: LoadScenarioSet
        x-kubephos-artifact-version: v1alpha1
      scenarioId:
        type: string
        title: Application journey
        description: Immutable Locust scenario supplied by the selected application.
        minLength: 1
        maxLength: 63
        default: storefront-journey
      action:
        type: string
        title: Action
        x-kubephos-primary-action: true
        enum:
          - start
          - stop
          - resume
        default: start
      replicas:
        type: integer
        title: Load workers
        minimum: 1
        maximum: 100
        default: 1
      users:
        type: integer
        title: Concurrent users per worker
        minimum: 1
        maximum: 100000
        default: 10
      spawnRate:
        type: integer
        title: Users started per second
        minimum: 1
        maximum: 100000
        default: 1
      pattern:
        type: string
        title: Temporal profile
        enum:
          - constant
          - ramp
          - steps
        default: constant
      durationSeconds:
        type: integer
        title: Duration in seconds
        description: Use zero for an interactive session that runs until stopped.
        minimum: 0
        maximum: 7200
        default: 900
      zoneWeights:
        type: object
        title: Geographic distribution
        additionalProperties: true
  runtime:
    executable: load-session-plugin
    timeout: 3h
  artifacts:
    inputs:
      - type: ClusterConnection
        version: v1alpha1
      - type: ApplicationDeployment
        version: v1alpha1
      - type: LoadScenarioSet
        version: v1alpha1
    outputs:
      - type: LoadSession
        version: v1alpha1
  capabilities:
    - load.session.control
    - load.session.preflight
    - load.session.cleanup
    - lifecycle.cleanup
  permissions:
    - cluster.admin
