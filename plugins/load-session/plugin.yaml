apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.load.kubernetes.session
  name: Interactive Kubernetes load session
  version: 0.1.0
  description: Starts, stops or resumes a declared load profile without coupling KubePhos to a load-testing tool.
spec:
  protocol: v1alpha1
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - clusterConnectionRef
      - applicationDeploymentRef
      - loadProfileSetRef
      - profileId
      - action
      - replicas
    properties:
      clusterConnectionRef:
        type: string
        title: Kubernetes cluster
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ClusterConnection
        x-kubephos-artifact-version: v1alpha1
      applicationDeploymentRef:
        type: string
        title: Application deployment
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ApplicationDeployment
        x-kubephos-artifact-version: v1alpha1
      loadProfileSetRef:
        type: string
        title: Load profiles
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: LoadProfileSet
        x-kubephos-artifact-version: v1alpha1
      profileId:
        type: string
        title: Load profile
        description: Stable profile ID declared by the application package.
        minLength: 1
        maxLength: 63
        default: default-load
      action:
        type: string
        title: Action
        x-kubephos-primary-action: true
        enum:
          - start
          - stop
          - resume
        default: start
      replicas:
        type: integer
        title: Load intensity
        description: Number of load driver replicas used by start or resume.
        minimum: 1
        maximum: 1000
        default: 1
  runtime:
    executable: load-session-plugin
    timeout: 20m
  artifacts:
    inputs:
      - type: ClusterConnection
        version: v1alpha1
      - type: ApplicationDeployment
        version: v1alpha1
      - type: LoadProfileSet
        version: v1alpha1
    outputs:
      - type: LoadSession
        version: v1alpha1
  capabilities:
    - load.session.control
    - load.session.preflight
  permissions:
    - cluster.admin
