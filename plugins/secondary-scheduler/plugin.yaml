apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.scheduler.kubernetes.secondary
  name: Managed secondary scheduler
  version: 0.2.0
  description: Installs an isolated Kubernetes scheduler and assigns only workloads selected by a validated target binding.
spec:
  protocol: v1alpha1
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - clusterConnectionRef
      - applicationDeploymentRef
      - targetBindingRef
      - image
      - configFile
    properties:
      clusterConnectionRef:
        type: string
        title: Kubernetes cluster
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ClusterConnection
        x-kubephos-artifact-version: v1alpha1
      applicationDeploymentRef:
        type: string
        title: Application deployment
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ApplicationDeployment
        x-kubephos-artifact-version: v1alpha1
      targetBindingRef:
        type: string
        title: Workload binding
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: TargetBinding
        x-kubephos-artifact-version: v1alpha1
      image:
        type: string
        title: Mirrored strategy image
        format: kubephos-strategy-image
        minLength: 1
      configFile:
        type: string
        title: Scheduler configuration
        description: KubeSchedulerConfiguration YAML. KubePhos assigns an isolated scheduler name and disables leader election.
        format: multiline
        x-kubephos-multiline: true
        minLength: 1
        maxLength: 131072
        default: |
          apiVersion: kubescheduler.config.k8s.io/v1
          kind: KubeSchedulerConfiguration
          profiles:
            - schedulerName: kubephos-managed
          leaderElection:
            leaderElect: false
  runtime:
    executable: secondary-scheduler-plugin
    timeout: 25m
  artifacts:
    inputs:
      - type: ClusterConnection
        version: v1alpha1
      - type: ApplicationDeployment
        version: v1alpha1
      - type: TargetBinding
        version: v1alpha1
    outputs:
      - type: SchedulerDeployment
        version: v1alpha1
  targeting:
    requiredTrait: schedulable
  capabilities:
    - scheduler.kubernetes.install
    - scheduler.kubernetes.bind
    - scheduler.kubernetes.preflight
    - scheduler.kubernetes.cleanup
    - lifecycle.cleanup
  permissions:
    - cluster.admin
