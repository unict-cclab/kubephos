apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.applications.inspect
  name: Application package materializer
  version: 0.2.0
  description: Resolves, materializes and verifies a pinned application package and its declared interface.
spec:
  protocol: v1alpha1
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    required:
      - applicationRef
    additionalProperties: false
    properties:
      applicationRef:
        type: string
        title: Application
        description: Immutable application version from the catalog.
        format: kubephos-application-ref
      values:
        type: object
        title: Application settings
        description: Validated settings declared by the selected application.
        x-kubephos-schema-from-application: applicationRef
  runtime:
    executable: application-inspector-plugin
    timeout: 10m
  artifacts:
    outputs:
      - type: ManifestSet
        version: v1alpha1
      - type: WorkloadTargets
        version: v1alpha1
      - type: ServiceEndpoints
        version: v1alpha1
      - type: LoadProfileSet
        version: v1alpha1
  capabilities:
    - applications.inspect
    - applications.materialize
  permissions:
    - catalog.read:applications
