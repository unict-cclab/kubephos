apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.machine.ssh.command
  name: Audited SSH command
  version: 0.1.0
  description: Runs a bounded command on a selected managed machine through its verified SSH artifacts.
spec:
  protocol: v1alpha1
  provider: machine
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - machineSetRef
      - machineAccessRef
      - machineIndex
      - command
      - timeoutSeconds
      - protectOutput
    properties:
      machineSetRef:
        type: string
        title: Managed machines
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: MachineSet
        x-kubephos-artifact-version: v1alpha1
      machineAccessRef:
        type: string
        title: Machine access
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: MachineAccess
        x-kubephos-artifact-version: v1alpha1
      machineIndex:
        type: integer
        title: Machine position
        description: Zero-based position in the selected managed machine set.
        minimum: 0
        maximum: 11
        default: 0
      command:
        type: string
        title: Command
        description: Non-interactive command executed by the declared SSH user.
        minLength: 1
        maxLength: 4096
        x-kubephos-multiline: true
      timeoutSeconds:
        type: integer
        title: Timeout seconds
        minimum: 1
        maximum: 600
        default: 60
      protectOutput:
        type: boolean
        title: Protect command output
        description: Keep enabled when output may contain credentials or private data.
        default: true
  runtime:
    executable: ssh-command-plugin
    timeout: 12m
  artifacts:
    inputs:
      - type: MachineSet
        version: v1alpha1
      - type: MachineAccess
        version: v1alpha1
    outputs:
      - type: RemoteCommandResult
        version: v1alpha1
  capabilities:
    - infrastructure.ssh.control
    - infrastructure.ssh.terminal
    - infrastructure.ssh.preflight
  permissions:
    - network.ssh
    - infrastructure.debug
