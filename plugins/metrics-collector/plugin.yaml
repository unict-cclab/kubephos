apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.metrics.prometheus.collect
  name: Kubernetes metrics collector
  version: 0.3.2
  description: Collects a normalized workload dataset through a compatible metrics capability.
spec:
  protocol: v1alpha1
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - clusterConnectionRef
      - applicationDeploymentRef
      - observabilityCapabilityRef
      - loadSessionRef
      - window
      - resolution
    properties:
      clusterConnectionRef:
        type: string
        title: Kubernetes cluster
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ClusterConnection
        x-kubephos-artifact-version: v1alpha1
      applicationDeploymentRef:
        type: string
        title: Application deployment
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ApplicationDeployment
        x-kubephos-artifact-version: v1alpha1
      observabilityCapabilityRef:
        type: string
        title: Metrics service
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ObservabilityCapability
        x-kubephos-artifact-version: v1alpha1
      loadSessionRef:
        type: string
        title: Completed load session
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: LoadSession
        x-kubephos-artifact-version: v1alpha1
      window:
        type: string
        title: Maximum fallback lookback
        enum:
          - 5m
          - 15m
          - 30m
          - 1h
        default: 15m
      resolution:
        type: string
        title: Data resolution
        enum:
          - 5s
          - 15s
          - 30s
          - 1m
        default: 15s
      sloMilliseconds:
        type: integer
        title: Response time SLO (ms)
        description: A time window violates the SLO when its P95 response time exceeds this value.
        minimum: 1
        maximum: 600000
        default: 250
  runtime:
    executable: metrics-collector-plugin
    timeout: 10m
  artifacts:
    inputs:
      - type: ClusterConnection
        version: v1alpha1
      - type: ApplicationDeployment
        version: v1alpha1
      - type: ObservabilityCapability
        version: v1alpha1
      - type: LoadSession
        version: v1alpha1
    outputs:
      - type: TimeSeriesDataset
        version: v1alpha1
  capabilities:
    - metrics.timeseries.collect
    - metrics.timeseries.preflight
  permissions:
    - cluster.read
    - network.http
