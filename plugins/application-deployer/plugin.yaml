apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.applications.kubernetes.deploy
  name: Kubernetes application deployer
  version: 0.13.0
  description: Deploys any validated application package into an isolated Kubernetes
    namespace and prepares shared experiment control resources when requested.
spec:
  protocol: v1alpha1
  commands:
  - describe
  - validate
  - plan
  - precheck
  - execute
  - verify
  - status
  - cancel
  - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
    - clusterConnectionRef
    - manifestSetRef
    - workloadTargetsRef
    - serviceEndpointsRef
    properties:
      istioInjection:
        type: boolean
      istioInjectionOverrides:
        type: object
        additionalProperties: true
      istioDataPlane:
        type: string
        enum: [sidecar, ambient]
      istioWaypoint:
        type: object
        x-kubephos-hidden: true
      clusterConnectionRef:
        type: string
        title: Kubernetes cluster
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ClusterConnection
        x-kubephos-artifact-version: v1alpha1
      manifestSetRef:
        type: string
        title: Application manifests
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ManifestSet
        x-kubephos-artifact-version: v1alpha1
      workloadTargetsRef:
        type: string
        title: Application workloads
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: WorkloadTargets
        x-kubephos-artifact-version: v1alpha1
      serviceEndpointsRef:
        type: string
        title: Application endpoints
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ServiceEndpoints
        x-kubephos-artifact-version: v1alpha1
      mode:
        type: string
        enum:
        - prepare
        - deploy
      schedulerName:
        type: string
      schedulerInclude:
        type: array
        items:
          type: string
      schedulerExclude:
        type: array
        items:
          type: string
      podDisruptionBudgetMinAvailable:
        type: integer
        title: Minimum available replicas
        description: PDB minAvailable generated for every deschedulable workload.
        minimum: 1
        maximum: 20
      controlNamespace:
        type: boolean
        x-kubephos-hidden: true
      istioProxyResources:
        type: object
        x-kubephos-hidden: true
      applicationPlacement:
        type: object
        x-kubephos-hidden: true
      placementControlName:
        type: string
        maxLength: 63
        x-kubephos-hidden: true
      namespacePolicy:
        type: string
        enum: [create]
        x-kubephos-hidden: true
      applicationNamespace:
        type: string
        maxLength: 63
  runtime:
    executable: application-deployer-plugin
    timeout: 25m
  artifacts:
    inputs:
    - type: ClusterConnection
      version: v1alpha1
    - type: ManifestSet
      version: v1alpha1
    - type: WorkloadTargets
      version: v1alpha1
    - type: ServiceEndpoints
      version: v1alpha1
    outputs:
    - type: ApplicationDeployment
      version: v1alpha1
  capabilities:
  - applications.kubernetes.deploy
  - applications.kubernetes.preflight
  - applications.kubernetes.cleanup
  - lifecycle.cleanup
  - lifecycle.cleanup.compatible
  permissions:
  - cluster.admin
