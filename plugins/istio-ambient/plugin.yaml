apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.platform.istio-ambient
  name: Istio ambient mode
  version: 0.1.0
  description: Installs istio-cni and ztunnel and switches the managed Istio control plane to the ambient profile, once per cluster.
spec:
  protocol: v1alpha1
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - clusterConnectionRef
    properties:
      clusterConnectionRef:
        type: string
        title: Kubernetes cluster
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: ClusterConnection
        x-kubephos-artifact-version: v1alpha1
  runtime:
    executable: istio-ambient-plugin
    timeout: 30m
  artifacts:
    inputs:
      - type: ClusterConnection
        version: v1alpha1
  capabilities:
    - istio.ambient.install
    - lifecycle.cleanup
  permissions:
    - cluster.admin
    - network.http
