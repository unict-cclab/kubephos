apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.storage.nfs.managed
  name: Managed shared storage
  version: 0.1.0
  description: Installs a validated shared-storage service on a dedicated machine.
spec:
  protocol: v1alpha1
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - machineSetRef
      - machineAccessRef
      - storageName
    properties:
      machineSetRef:
        type: string
        title: Storage machine
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: MachineSet
        x-kubephos-artifact-version: v1alpha1
      machineAccessRef:
        type: string
        title: Machine access
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: MachineAccess
        x-kubephos-artifact-version: v1alpha1
      storageName:
        type: string
        title: Storage name
        pattern: "^[a-z0-9][a-z0-9-]{0,31}$"
        default: shared-storage
  runtime:
    executable: nfs-plugin
    timeout: 20m
  artifacts:
    inputs:
      - type: MachineSet
        version: v1alpha1
      - type: MachineAccess
        version: v1alpha1
    outputs:
      - type: SharedStorageEndpoint
        version: v1alpha1
  capabilities:
    - storage.shared.provision
    - storage.shared.preflight
    - storage.shared.cleanup
    - lifecycle.cleanup
  permissions:
    - network.ssh
    - storage.manage
