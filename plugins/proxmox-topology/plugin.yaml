apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.infrastructure.proxmox.topology
  name: Proxmox machine topology
  version: 0.2.0
  description: Creates a validated group of isolated machines from one Proxmox template.
spec:
  protocol: v1alpha1
  provider: proxmox
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - connectionRef
      - node
      - templateVMID
      - baseVMID
      - namePrefix
      - machineCount
      - cores
      - memoryMiB
      - diskGiB
      - sshUser
      - cleanupAfterTest
    properties:
      connectionRef:
        type: string
        title: Proxmox connection
        format: kubephos-connection-ref
        x-kubephos-provider: proxmox
      node:
        type: string
        title: Proxmox node
        minLength: 1
        maxLength: 64
      templateVMID:
        type: integer
        title: Template VMID
        minimum: 100
        maximum: 999999999
      baseVMID:
        type: integer
        title: First new VMID
        minimum: 100
        maximum: 999999988
      namePrefix:
        type: string
        title: Machine group name
        pattern: "^[a-z0-9][a-z0-9-]{0,19}$"
        default: cluster
      machineCount:
        type: integer
        title: Number of machines
        minimum: 1
        maximum: 12
        default: 3
      cores:
        type: integer
        title: CPU cores per machine
        minimum: 1
        maximum: 32
        default: 2
      memoryMiB:
        type: integer
        title: Memory MiB per machine
        minimum: 512
        maximum: 131072
        default: 4096
      diskGiB:
        type: integer
        title: Disk GiB per machine
        minimum: 8
        maximum: 2048
        default: 32
      sshUser:
        type: string
        title: SSH user
        pattern: "^[a-z_][a-z0-9_-]{0,31}$"
        default: ubuntu
      cleanupAfterTest:
        type: boolean
        title: Remove machines after validation
        default: false
  runtime:
    executable: proxmox-topology-plugin
    timeout: 30m
  artifacts:
    outputs:
      - type: MachineSet
        version: v1alpha1
      - type: MachineAccess
        version: v1alpha1
  capabilities:
    - infrastructure.provision
    - infrastructure.deprovision
    - infrastructure.preflight
    - lifecycle.cleanup
  permissions:
    - network.proxmox.read
    - network.proxmox.write
    - secrets.read:proxmox-api-token
