apiVersion: plugins.kubephos.io/v1alpha1
kind: Plugin
metadata:
  id: io.kubephos.infrastructure.proxmox.topology
  name: Proxmox machine topology
  version: 0.3.1
  description: Creates a validated group of isolated machines from one Proxmox template.
spec:
  protocol: v1alpha1
  provider: proxmox
  commands:
    - describe
    - validate
    - plan
    - precheck
    - execute
    - verify
    - status
    - cancel
    - cleanup
  configurationSchema:
    type: object
    additionalProperties: false
    required:
      - connectionRef
      - node
      - templateVMID
      - baseVMID
      - addressStart
      - prefixLength
      - gateway
      - dnsServer
      - namePrefix
      - machineCount
      - cores
      - memoryMiB
      - diskGiB
      - sshUser
      - cleanupAfterTest
    properties:
      connectionRef:
        type: string
        title: Proxmox connection
        format: kubephos-connection-ref
        x-kubephos-provider: proxmox
      machineTemplateRef:
        type: string
        title: Managed machine template
        format: kubephos-artifact-ref
        x-kubephos-artifact-type: MachineTemplate
        x-kubephos-artifact-version: v1alpha1
      node:
        type: string
        title: Proxmox node
        minLength: 1
        maxLength: 64
      templateVMID:
        type: integer
        title: Template VMID
        minimum: 100
        maximum: 999999999
      baseVMID:
        type: integer
        title: First new VMID
        minimum: 100
        maximum: 999999988
      addressStart:
        type: string
        title: First machine address
      prefixLength:
        type: integer
        title: Network prefix length
        minimum: 8
        maximum: 30
        default: 24
      gateway:
        type: string
        title: Network gateway
      dnsServer:
        type: string
        title: DNS server
      namePrefix:
        type: string
        title: Machine group name
        pattern: "^[a-z0-9][a-z0-9-]{0,19}$"
        default: cluster
      machineCount:
        type: integer
        title: Number of machines
        minimum: 1
        maximum: 12
        default: 3
      cores:
        type: integer
        title: Default CPU cores per machine
        minimum: 1
        maximum: 32
        default: 2
      memoryMiB:
        type: integer
        title: Default memory MiB per machine
        minimum: 512
        maximum: 131072
        default: 4096
      diskGiB:
        type: integer
        title: Default disk GiB per machine
        minimum: 8
        maximum: 2048
        default: 32
      machineProfiles:
        type: array
        title: Capacity for each machine
        maxItems: 12
        items:
          type: object
          additionalProperties: false
          required:
            - cores
            - memoryMiB
            - diskGiB
          properties:
            cores:
              type: integer
              minimum: 1
              maximum: 32
            memoryMiB:
              type: integer
              minimum: 512
              maximum: 131072
            diskGiB:
              type: integer
              minimum: 8
              maximum: 2048
      sshUser:
        type: string
        title: SSH user
        pattern: "^[a-z_][a-z0-9_-]{0,31}$"
        default: ubuntu
      cleanupAfterTest:
        type: boolean
        title: Remove machines after validation
        default: false
  runtime:
    executable: proxmox-topology-plugin
    timeout: 30m
  artifacts:
    inputs:
      - type: MachineTemplate
        version: v1alpha1
    outputs:
      - type: MachineSet
        version: v1alpha1
      - type: MachineAccess
        version: v1alpha1
  capabilities:
    - infrastructure.machine-topology.provision
    - infrastructure.provision
    - infrastructure.deprovision
    - infrastructure.preflight
    - lifecycle.cleanup
  permissions:
    - network.proxmox.read
    - network.proxmox.write
    - secrets.read:proxmox-api-token
