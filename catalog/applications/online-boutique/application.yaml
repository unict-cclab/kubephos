apiVersion: catalog.kubephos.dev/v1alpha1
kind: Application
metadata:
  id: dev.kubephos.online-boutique
  name: Online Boutique
  version: 0.10.5-kubephos.6
  description: Cloud-native microservices demo with source-aware traffic ingress and an immutable Locust scenario.
spec:
  package:
    type: git
    format: plain-yaml
    repository: https://github.com/GoogleCloudPlatform/microservices-demo.git
    revision: 16a51f8dbabc4af2c4c82f81ca6d4813888c2c34
    path: release
    entrypoint: kubernetes-manifests.yaml
  interface:
    components:
      - id: currencyservice
        workload: {apiVersion: apps/v1, kind: Deployment, name: currencyservice}
        selector: {app: currencyservice}
        traits: [scalable, schedulable]
      - id: productcatalogservice
        workload: {apiVersion: apps/v1, kind: Deployment, name: productcatalogservice}
        selector: {app: productcatalogservice}
        traits: [scalable, schedulable]
      - id: checkoutservice
        workload: {apiVersion: apps/v1, kind: Deployment, name: checkoutservice}
        selector: {app: checkoutservice}
        traits: [scalable, schedulable]
      - id: shippingservice
        workload: {apiVersion: apps/v1, kind: Deployment, name: shippingservice}
        selector: {app: shippingservice}
        traits: [scalable, schedulable]
      - id: cartservice
        workload: {apiVersion: apps/v1, kind: Deployment, name: cartservice}
        selector: {app: cartservice}
        traits: [scalable, schedulable]
      - id: redis-cart
        workload: {apiVersion: apps/v1, kind: Deployment, name: redis-cart}
        selector: {app: redis-cart}
        traits: [schedulable, stateful]
      - id: emailservice
        workload: {apiVersion: apps/v1, kind: Deployment, name: emailservice}
        selector: {app: emailservice}
        traits: [scalable, schedulable]
      - id: paymentservice
        workload: {apiVersion: apps/v1, kind: Deployment, name: paymentservice}
        selector: {app: paymentservice}
        traits: [scalable, schedulable]
      - id: frontend
        workload: {apiVersion: apps/v1, kind: Deployment, name: frontend}
        selector: {app: frontend}
        traits: [scalable, schedulable]
      - id: recommendationservice
        workload: {apiVersion: apps/v1, kind: Deployment, name: recommendationservice}
        selector: {app: recommendationservice}
        traits: [scalable, schedulable]
      - id: adservice
        workload: {apiVersion: apps/v1, kind: Deployment, name: adservice}
        selector: {app: adservice}
        traits: [scalable, schedulable]
      - id: node-proxy
        workload: {apiVersion: apps/v1, kind: DaemonSet, name: node-proxy}
        selector: {app: node-proxy}
        traits: [traffic-entrypoint]
    endpoints:
      - id: frontend-http
        component: frontend
        service: frontend
        port: 80
        protocol: http
        path: /
      - id: node-proxy-http
        component: node-proxy
        service: node-proxy
        port: 80
        protocol: http
        path: /
    loadScenarios:
      - id: storefront-journey
        engine: locust
        script: src/loadgenerator/locustfile.py
        runtimeImage: us-central1-docker.pkg.dev/google-samples/microservices-demo/loadgenerator:v0.10.5
        targetEndpoint: node-proxy-http
  excludeResources:
    - {apiVersion: apps/v1, kind: Deployment, name: loadgenerator}
    - {apiVersion: v1, kind: ServiceAccount, name: loadgenerator}
  additionalManifests:
    - id: node-proxy
      content: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: node-proxy
        data:
          default.conf.template: |
            server {
              listen 8080;
              location / {
                proxy_http_version 1.1;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Kubephos-Proxy-Node ${NODE_NAME};
                proxy_set_header X-Kubephos-Proxy-Zone ${NODE_ZONE};
                proxy_pass http://frontend:80;
              }
            }
        ---
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: node-proxy
          labels:
            app: node-proxy
            component: node-proxy
        spec:
          selector:
            matchLabels:
              app: node-proxy
          template:
            metadata:
              labels:
                app: node-proxy
                component: node-proxy
            spec:
              nodeSelector:
                kubephos.dev/role: application
              containers:
                - name: nginx
                  image: nginx:1.27-alpine
                  ports:
                    - name: http
                      containerPort: 8080
                  env:
                    - name: NODE_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: spec.nodeName
                    - name: NODE_ZONE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['topology.kubernetes.io/zone']
                  volumeMounts:
                    - name: config
                      mountPath: /etc/nginx/templates/default.conf.template
                      subPath: default.conf.template
                  resources:
                    requests: {cpu: 25m, memory: 32Mi}
                    limits: {cpu: 250m, memory: 128Mi}
              volumes:
                - name: config
                  configMap:
                    name: node-proxy
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: node-proxy
        spec:
          type: NodePort
          externalTrafficPolicy: Local
          selector:
            app: node-proxy
          ports:
            - name: http
              port: 80
              targetPort: 8080
  valuesSchema:
    type: object
    additionalProperties: false
    properties:
      frontendReplicas:
        type: integer
        title: Frontend replicas
        description: Initial frontend replicas before any autoscaler takes control.
        minimum: 1
        maximum: 20
      workloadProbeTimeoutSeconds:
        type: integer
        title: Workload probe timeout
        description: Timeout used by health probes on workloads with longer startup times.
        minimum: 1
        maximum: 30
      workloadLivenessInitialDelaySeconds:
        type: integer
        title: Workload liveness delay
        description: Grace period before liveness checks can restart workloads with longer startup times.
        minimum: 0
        maximum: 300
  defaults:
    frontendReplicas: 1
    workloadProbeTimeoutSeconds: 5
    workloadLivenessInitialDelaySeconds: 60
  overlays:
    - target: {apiVersion: apps/v1, kind: Deployment, name: frontend}
      operations:
        - op: add
          path: /spec/replicas
          valueFrom: /frontendReplicas
    - target: {apiVersion: apps/v1, kind: Deployment, name: emailservice}
      operations:
        - op: add
          path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
          valueFrom: /workloadProbeTimeoutSeconds
        - op: add
          path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
          valueFrom: /workloadProbeTimeoutSeconds
        - op: add
          path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
          valueFrom: /workloadLivenessInitialDelaySeconds
    - target: {apiVersion: apps/v1, kind: Deployment, name: recommendationservice}
      operations:
        - op: add
          path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
          valueFrom: /workloadProbeTimeoutSeconds
        - op: add
          path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
          valueFrom: /workloadProbeTimeoutSeconds
        - op: add
          path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
          valueFrom: /workloadLivenessInitialDelaySeconds
