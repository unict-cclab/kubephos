apiVersion: catalog.kubephos.dev/v1alpha1
kind: Application
metadata:
  id: dev.kubephos.localai
  name: LocalAI
  description: CPU inference benchmark with a selectable model per service, shared
    model and backend cache, and header-based routing.
spec:
  package:
    type: embedded
    format: plain-yaml
    entrypoint: generated.yaml
  materializer: io.kubephos.applications.localai
  materializerConfig:
