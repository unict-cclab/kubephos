  interface:
    group: localai
    components:
    - id: m1
      workload:
        apiVersion: apps/v1
        kind: Deployment
        name: m1
      selector:
        app: m1
      traits:
      - scalable
      - schedulable
      - deschedulable
      index: 1
    - id: m2
      workload:
        apiVersion: apps/v1
        kind: Deployment
        name: m2
      selector:
        app: m2
      traits:
      - scalable
      - schedulable
      - deschedulable
      index: 1
    - id: m3
      workload:
        apiVersion: apps/v1
        kind: Deployment
        name: m3
      selector:
        app: m3
      traits:
      - scalable
      - schedulable
      - deschedulable
      index: 1
    - id: node-proxy
      workload:
        apiVersion: apps/v1
        kind: DaemonSet
        name: node-proxy
      selector:
        app: node-proxy
      traits:
      - traffic-entrypoint
      index: 0
      dependencies:
      - m1
      - m2
      - m3
    endpoints:
    - id: node-proxy-http
      component: node-proxy
      service: node-proxy
      port: 80
      protocol: http
      path: /
    loadScenarios:
    - id: inference
      engine: locust
      script: generated/locustfile.py
      runtimeImage: locustio/locust:2.42.6
      targetEndpoint: node-proxy-http
  valuesSchema:
    type: object
    additionalProperties: false
    x-kubephos-dynamic-topology: true
    properties:
      models:
        x-kubephos-order: 1
        type: array
        title: Models per service
        minItems: 1
        maxItems: 100
        items:
          type: string
          enum:
          - Qwen2.5-0.5B-Instruct
          - Qwen2.5-1.5B-Instruct
          - Qwen2.5-3B-Instruct
          - Qwen3-0.6B
          - Qwen3-1.7B
          - Qwen3-4B
          - Qwen2.5-Coder-0.5B-Instruct
          - Qwen2.5-Coder-1.5B-Instruct
          - Qwen2.5-Coder-3B-Instruct
        x-kubephos-item-prefix: m
      initialReplicas:
        x-kubephos-order: 2
        type: integer
        title: Initial replicas per service
        minimum: 1
        maximum: 20
      replicaOverrides:
        x-kubephos-order: 3
        type: object
        title: Initial replicas by service
        additionalProperties: true
      contextSize:
        x-kubephos-order: 4
        type: integer
        title: Context size (tokens)
        minimum: 128
        maximum: 32768
      threads:
        x-kubephos-order: 5
        type: integer
        title: CPU threads per service replica
        minimum: 1
        maximum: 64
      storageSize:
        x-kubephos-order: 6
        type: string
        title: Model storage size
        pattern: ^[1-9][0-9]*(Mi|Gi|Ti)$
      prompt:
        x-kubephos-order: 7
        type: string
        title: Inference prompt
        minLength: 1
        maxLength: 4096
      maxTokens:
        x-kubephos-order: 8
        type: integer
        title: Maximum output tokens
        minimum: 1
        maximum: 2048
      cpuRequest:
        x-kubephos-order: 9
        type: string
        title: CPU request per service (optional)
        minLength: 1
        maxLength: 16
      memoryRequest:
        x-kubephos-order: 10
        type: string
        title: Memory request per service (optional)
        minLength: 1
        maxLength: 16
      cpuLimit:
        x-kubephos-order: 11
        type: string
        title: CPU limit per service (optional)
        minLength: 1
        maxLength: 16
      memoryLimit:
        x-kubephos-order: 12
        type: string
        title: Memory limit per service (optional)
        minLength: 1
        maxLength: 16
      resourceOverrides:
        x-kubephos-order: 13
        type: object
        title: Resource overrides by service
        additionalProperties: true
    required:
    - models
    - initialReplicas
    - contextSize
    - threads
    - storageSize
    - prompt
    - maxTokens
    x-kubephos-service-prefix: m
  defaults:
    models:
    - Qwen2.5-0.5B-Instruct
    - Qwen2.5-1.5B-Instruct
    - Qwen2.5-Coder-0.5B-Instruct
    initialReplicas: 1
    replicaOverrides: {}
    contextSize: 2048
    threads: 1
    storageSize: 20Gi
    prompt: Write a short sentence about Kubernetes.
    maxTokens: 32
    resourceOverrides: {}
