apiVersion: catalog.kubephos.dev/v1alpha1
kind: Application
metadata:
  id: dev.kubephos.mubench
  name: muBench
  version: 1.0.0-kubephos.3
  description: Configurable microservice benchmark with source-aware traffic ingress.
spec:
  package:
    type: git
    format: plain-yaml
    repository: https://github.com/mSvcBench/muBench.git
    revision: 176c8f14f2740414436078d5dcd969d38dd4acd4
    path: .
    entrypoint: generated.yaml
  materializer: io.kubephos.applications.mubench
  materializerConfig:
    serviceImage: docker.io/msvcbench/microservice@sha256:26f486c7e546100c509501809aa4a36b283d3a2e45be09f56b059c6fe531f776
  interface:
    group: mubench
    components:
      - id: s0
        workload: {apiVersion: apps/v1, kind: Deployment, name: s0}
        selector: {app: s0}
        traits: [scalable, schedulable, deschedulable]
        index: 0
        dependencies: [s1]
      - id: s1
        workload: {apiVersion: apps/v1, kind: Deployment, name: s1}
        selector: {app: s1}
        traits: [scalable, schedulable, deschedulable]
        index: 1
        dependencies: [s2]
      - id: s2
        workload: {apiVersion: apps/v1, kind: Deployment, name: s2}
        selector: {app: s2}
        traits: [scalable, schedulable, deschedulable]
        index: 2
        dependencies: [s3]
      - id: s3
        workload: {apiVersion: apps/v1, kind: Deployment, name: s3}
        selector: {app: s3}
        traits: [scalable, schedulable, deschedulable]
        index: 3
        dependencies: [s4]
      - id: s4
        workload: {apiVersion: apps/v1, kind: Deployment, name: s4}
        selector: {app: s4}
        traits: [scalable, schedulable, deschedulable]
        index: 4
        dependencies: [s5]
      - id: s5
        workload: {apiVersion: apps/v1, kind: Deployment, name: s5}
        selector: {app: s5}
        traits: [scalable, schedulable, deschedulable]
        index: 5
      - id: node-proxy
        workload: {apiVersion: apps/v1, kind: DaemonSet, name: node-proxy}
        selector: {app: node-proxy}
        traits: [traffic-entrypoint]
        index: 0
        dependencies: [s0]
    endpoints:
      - {id: entry-http, component: s0, service: s0, port: 80, protocol: http, path: /api/v1}
      - {id: node-proxy-http, component: node-proxy, service: node-proxy, port: 80, protocol: http, path: /}
    loadScenarios:
      - {id: default-journey, engine: locust, script: generated/locustfile.py, runtimeImage: 'locustio/locust:2.42.6', targetEndpoint: node-proxy-http}
  valuesSchema:
    type: object
    additionalProperties: false
    x-kubephos-dynamic-topology: true
    properties:
      serviceCount: {type: integer, title: Services, minimum: 2, maximum: 100}
      topology: {type: string, title: Request topology, enum: [chain, fan-out, tree]}
      initialReplicas: {type: integer, title: Initial replicas, minimum: 1, maximum: 20}
      replicaOverrides: {type: object, title: Service overrides, additionalProperties: true}
      workers: {type: integer, title: Workers per service, minimum: 1, maximum: 32}
      threads: {type: integer, title: Threads per worker, minimum: 1, maximum: 64}
      workloadProfile: {type: string, title: Work per request, enum: [light, balanced, heavy]}
      responseSizeKB: {type: integer, title: Average response size (KB), minimum: 1, maximum: 10240}
      cpuRequest: {type: string, title: CPU request, minLength: 1, maxLength: 16}
      memoryRequest: {type: string, title: Memory request, minLength: 1, maxLength: 16}
  defaults:
    serviceCount: 6
    topology: chain
    initialReplicas: 1
    replicaOverrides: {}
    workers: 2
    threads: 4
    workloadProfile: balanced
    responseSizeKB: 10
    cpuRequest: 250m
    memoryRequest: 256Mi
