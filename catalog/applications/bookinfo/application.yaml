apiVersion: catalog.kubephos.dev/v1alpha1
kind: Application
metadata:
  id: dev.kubephos.bookinfo
  name: Bookinfo
  description: Istio Bookinfo with an immutable storefront scenario and source-aware traffic ingress.
spec:
  package:
    type: git
    format: plain-yaml
    repository: https://github.com/istio/istio.git
    revision: 3e6d3d9537d6c3876b1d2c5985ea3e5207d73268
    path: samples/bookinfo/platform/kube
    entrypoint: bookinfo.yaml
  interface:
    group: bookinfo
    components:
      - id: node-proxy
        workload: {apiVersion: apps/v1, kind: DaemonSet, name: node-proxy}
        selector: {app: node-proxy}
        traits: [traffic-entrypoint]
        index: 0
        dependencies: [productpage-v1]
      - id: productpage-v1
        workload: {apiVersion: apps/v1, kind: Deployment, name: productpage-v1}
        selector: {app: productpage}
        traits: [scalable, schedulable, deschedulable]
        index: 1
        dependencies: [details-v1, reviews-v1, reviews-v2, reviews-v3]
      - id: reviews-v1
        workload: {apiVersion: apps/v1, kind: Deployment, name: reviews-v1}
        selector: {app: reviews, version: v1}
        traits: [scalable, schedulable, deschedulable]
        index: 2
      - id: reviews-v2
        workload: {apiVersion: apps/v1, kind: Deployment, name: reviews-v2}
        selector: {app: reviews, version: v2}
        traits: [scalable, schedulable, deschedulable]
        index: 2
        dependencies: [ratings-v1]
      - id: reviews-v3
        workload: {apiVersion: apps/v1, kind: Deployment, name: reviews-v3}
        selector: {app: reviews, version: v3}
        traits: [scalable, schedulable, deschedulable]
        index: 2
        dependencies: [ratings-v1]
      - id: details-v1
        workload: {apiVersion: apps/v1, kind: Deployment, name: details-v1}
        selector: {app: details, version: v1}
        traits: [scalable, schedulable, deschedulable]
        index: 3
      - id: ratings-v1
        workload: {apiVersion: apps/v1, kind: Deployment, name: ratings-v1}
        selector: {app: ratings, version: v1}
        traits: [scalable, schedulable, deschedulable]
        index: 3
    endpoints:
      - id: productpage-http
        component: productpage-v1
        service: productpage
        port: 9080
        protocol: http
        path: /productpage
      - id: node-proxy-http
        component: node-proxy
        service: node-proxy
        port: 80
        protocol: http
        path: /productpage
    loadScenarios:
      - id: bookstore-journey
        engine: locust
        script: kubephos/bookinfo-locustfile.py
        content: |
          from locust import HttpUser, task

          class WebsiteUser(HttpUser):
              @task
              def browse_product(self):
                  self.client.get("/productpage")
        runtimeImage: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/loadgenerator:v0.6.10@sha256:dd7e27f1b1bcbb9c85070eb900a6060d098d06d62ef03f98182424919895df83
        targetEndpoint: node-proxy-http
  additionalManifests:
    - id: node-proxy
      content: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: node-proxy
        data:
          default.conf.template: |
            server {
              listen 8080;
              location / {
                proxy_http_version 1.1;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Kubephos-Proxy-Node ${NODE_NAME};
                proxy_set_header X-Kubephos-Proxy-Zone ${NODE_ZONE};
                proxy_pass http://productpage:9080;
              }
            }
        ---
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: node-proxy
          labels: {app: node-proxy, component: node-proxy}
        spec:
          selector:
            matchLabels: {app: node-proxy}
          template:
            metadata:
              labels: {app: node-proxy, component: node-proxy}
            spec:
              nodeSelector: {kubephos.dev/role: application}
              containers:
                - name: nginx
                  image: nginx:1.27-alpine
                  ports: [{name: http, containerPort: 8080}]
                  env:
                    - name: NODE_NAME
                      valueFrom:
                        fieldRef: {fieldPath: spec.nodeName}
                    - name: NODE_ZONE
                      valueFrom:
                        fieldRef: {fieldPath: "metadata.labels['topology.kubernetes.io/zone']"}
                  volumeMounts:
                    - {name: config, mountPath: /etc/nginx/templates/default.conf.template, subPath: default.conf.template}
              volumes:
                - name: config
                  configMap: {name: node-proxy}
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: node-proxy
        spec:
          type: NodePort
          externalTrafficPolicy: Local
          selector: {app: node-proxy}
          ports: [{name: http, port: 80, targetPort: 8080}]
  valuesSchema:
    type: object
    additionalProperties: false
    properties:
      initialReplicas:
        x-kubephos-order: 1
        type: integer
        title: Initial replicas
        minimum: 1
        maximum: 20
      replicaOverrides:
        x-kubephos-order: 2
        type: object
        title: Initial replicas by service
        additionalProperties: true
      cpuRequest:
        x-kubephos-order: 3
        type: string
        title: CPU request per service (optional)
        minLength: 1
        maxLength: 16
      memoryRequest:
        x-kubephos-order: 4
        type: string
        title: Memory request per service (optional)
        minLength: 1
        maxLength: 16
      cpuLimit:
        x-kubephos-order: 5
        type: string
        title: CPU limit per service (optional)
        minLength: 1
        maxLength: 16
      memoryLimit:
        x-kubephos-order: 6
        type: string
        title: Memory limit per service (optional)
        minLength: 1
        maxLength: 16
      resourceOverrides:
        x-kubephos-order: 7
        type: object
        title: Resource overrides by service
        additionalProperties: true
  defaults:
    initialReplicas: 1
    replicaOverrides: {}
