        engine: locust
        script: kubephos/train-ticket-locustfile.py
        content: |
          from datetime import date, timedelta
          from locust import HttpUser, between, task

          class WebsiteUser(HttpUser):
              wait_time = between(1, 3)

              def on_start(self):
                  response = self.client.post(
                      "/api/v1/users/login",
                      json={"username": "fdse_microservice", "password": "111111"},
                      name="login",
                  )
                  if response.ok:
                      data = response.json().get("data") or {}
                      token = data.get("token")
                      if token:
                          self.client.headers.update({"Authorization": "Bearer " + token})

              @task(3)
              def high_speed_search(self):
                  self.search("/api/v1/travelservice/trips/left", "Shang Hai", "Su Zhou", "high-speed search")

              @task(2)
              def regular_search(self):
                  self.search("/api/v1/travel2service/trips/left", "Shang Hai", "Nan Jing", "regular search")

              def search(self, path, departure, arrival, name):
                  payload = {
                      "departureTime": (date.today() + timedelta(days=1)).isoformat(),
                      "startingPlace": departure,
                      "endPlace": arrival,
                  }
                  with self.client.post(path, json=payload, name=name, catch_response=True) as response:
                      if not response.ok:
                          response.failure("HTTP " + str(response.status_code))
                          return
                      try:
                          body = response.json()
                      except ValueError:
                          response.failure("invalid JSON response")
                          return
                      if body.get("data") is None:
                          response.failure(str(body.get("msg") or "missing result"))
        runtimeImage: locustio/locust:2.42.6
        targetEndpoint: node-proxy-http
