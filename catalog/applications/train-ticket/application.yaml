              location /api/v1/inside_pay_service/ { proxy_pass http://ts-inside-payment-service:18673; }
              location /api/v1/newsservice/ { proxy_pass http://ts-news-service:12862; }
              location /api/v1/notifyservice/ { proxy_pass http://ts-notification-service:17853; }
              location /api/v1/orderOtherService/ { proxy_pass http://ts-order-other-service:12032; }
              location /api/v1/orderservice/ { proxy_pass http://ts-order-service:12031; }
              location /api/v1/paymentservice/ { proxy_pass http://ts-payment-service:19001; }
              location /api/v1/preserveotherservice/ { proxy_pass http://ts-preserve-other-service:14569; }
              location /api/v1/preserveservice/ { proxy_pass http://ts-preserve-service:14568; }
              location /api/v1/priceservice/ { proxy_pass http://ts-price-service:16579; }
              location /api/v1/rebookservice/ { proxy_pass http://ts-rebook-service:18886; }
              location /api/v1/routeplanservice/ { proxy_pass http://ts-route-plan-service:14578; }
              location /api/v1/routeservice/ { proxy_pass http://ts-route-service:11178; }
              location /api/v1/seatservice/ { proxy_pass http://ts-seat-service:18898; }
              location /api/v1/securityservice/ { proxy_pass http://ts-security-service:11188; }
              location /api/v1/stationservice/ { proxy_pass http://ts-station-service:12345; }
              location /api/v1/ticketoffice/ { proxy_pass http://ts-ticket-office-service:16108; }
              location /api/v1/ticketinfoservice/ { proxy_pass http://ts-ticketinfo-service:15681; }
              location /api/v1/trainservice/ { proxy_pass http://ts-train-service:14567; }
              location /api/v1/travel2service/ { proxy_pass http://ts-travel2-service:16346; }
              location /api/v1/travelplanservice/ { proxy_pass http://ts-travel-plan-service:14322; }
              location /api/v1/travelservice/ { proxy_pass http://ts-travel-service:12346; }
              location /api/v1/userservice/ { proxy_pass http://ts-user-service:12342; }
              location /api/v1/verifycode/ { proxy_pass http://ts-verification-code-service:15678; }
              location /api/v1/voucherservice/ { proxy_pass http://ts-voucher-service:16101; }
              location / { proxy_pass http://ts-ui-dashboard:8080; }
            }
        ---
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: node-proxy
          labels: {app: node-proxy, component: node-proxy}
        spec:
          selector:
            matchLabels: {app: node-proxy}
          template:
            metadata:
              labels: {app: node-proxy, component: node-proxy}
            spec:
              nodeSelector: {kubephos.dev/role: application}
              containers:
                - name: nginx
                  image: nginx:1.27-alpine
                  ports: [{name: http, containerPort: 8080}]
                  env:
                    - name: NODE_NAME
                      valueFrom:
                        fieldRef: {fieldPath: spec.nodeName}
                    - name: NODE_ZONE
                      valueFrom:
                        fieldRef: {fieldPath: "metadata.labels['topology.kubernetes.io/zone']"}
                  volumeMounts:
                    - {name: config, mountPath: /etc/nginx/templates/default.conf.template, subPath: default.conf.template}
                  resources:
                    requests: {cpu: 25m, memory: 32Mi}
                    limits: {cpu: 250m, memory: 128Mi}
              volumes:
                - name: config
                  configMap: {name: node-proxy}
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: node-proxy
        spec:
          type: NodePort
          externalTrafficPolicy: Local
          selector: {app: node-proxy}
          ports: [{name: http, port: 80, targetPort: 8080}]
  excludeResources:
    - {apiVersion: apps/v1, kind: Deployment, name: jaeger}
    - {apiVersion: v1, kind: Service, name: jaeger-query}
    - {apiVersion: v1, kind: Service, name: jaeger-collector}
    - {apiVersion: v1, kind: Service, name: jaeger}
    - {apiVersion: v1, kind: Service, name: zipkin}
  storageClassMappings:
    - source: nfs
      target: shared-storage
      removeStaticVolumes: true
  imageMappings:
    - source: mongo
      target: mongo:4.0.28
  valuesSchema:
    type: object
    additionalProperties: false
    properties:
      initialReplicas:
        type: integer
        title: Initial replicas
        minimum: 1
        maximum: 20
      replicaOverrides:
        type: object
        title: Service overrides
        additionalProperties: true
  defaults:
    initialReplicas: 1
    replicaOverrides: {}
  overlays:
    - target: {apiVersion: v1, kind: Service, name: ts-ui-dashboard}
      operations:
        - {op: remove, path: /spec/ports/0/nodePort}
        - {op: remove, path: /spec/type}
