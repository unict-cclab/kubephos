apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-proxy
  namespace: ai-workload
spec:
  selector:
    matchLabels:
      app: node-proxy
  template:
    metadata:
      labels:
        app: node-proxy
        group: ai-workload
    spec:
      containers:
      - name: proxy
        image: docker.io/library/nginx:stable-alpine
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/templates/default.conf.template
          subPath: default.conf.template
      volumes:
      - name: config
        configMap:
          name: node-proxy-config
